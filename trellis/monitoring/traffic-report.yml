---
# Generate a traffic analysis report from a site's Nginx access log.
#
# @desc     Generate a traffic analysis report from a site's Nginx access log
# @category monitoring
# @runs     local
# @requires ansible-playbook
# @arg      site        required  {example.com}  Site name as in wordpress_sites.yml
# @arg      env         required  {production|staging|development}  Target environment
# @flag     hours      optional  {24}  How many hours of log history to include
# @flag     log_path   optional  {/path/to/access.log}  Override the default per-site access log path
# @example  wp-ops trellis/monitoring/traffic-report -e site=example.com -e env=production
# @doc      trellis/monitoring/README.md
- import_playbook: variable-check.yml
  vars:
    playbook: traffic-report.yml

- name: Generate traffic report for {{ site }} {{ env }}
  hosts: web:&{{ env }}
  remote_user: "{{ web_user }}"

  vars:
    project: "{{ wordpress_sites[site] }}"
    project_root: "{{ www_root }}/{{ site }}"
    report_hours: "{{ hours | default('24') }}"
    # Log file path - defaults to per-site logs, can be overridden with -e log_file=/path/to/log
    log_file: "{{ log_path | default(project_root + '/logs/access.log') }}"

  pre_tasks:
    - name: Ensure site is valid
      delegate_to: localhost
      fail:
        msg: "Site `{{ site | default('') }}` is not valid. Available sites: {{ wordpress_sites.keys() | join(', ') }}"
      when: wordpress_sites[site | default('')] is not defined

  tasks:
    - name: Check if traffic-monitor.sh exists on remote
      stat:
        path: "/home/{{ web_user }}/traffic-monitor.sh"
      register: script_stat

    - name: Copy traffic-monitor.sh to remote server
      copy:
        src: "../../scripts/monitoring/traffic-monitor.sh"
        dest: "/home/{{ web_user }}/traffic-monitor.sh"
        mode: '0755'
      when: not script_stat.stat.exists

    - name: Run traffic analysis
      shell: "/home/{{ web_user }}/traffic-monitor.sh {{ log_file }} {{ report_hours }}"
      register: traffic_report

    - name: Display traffic report
      debug:
        msg: "{{ traffic_report.stdout_lines }}"

    - name: Save report to local file
      delegate_to: localhost
      copy:
        content: "{{ traffic_report.stdout }}"
        dest: "{{ playbook_dir }}/traffic-report-{{ site }}-{{ env }}-{{ ansible_date_time.iso8601_basic_short }}.txt"
      become: no
      when: save_report is defined and save_report | bool
