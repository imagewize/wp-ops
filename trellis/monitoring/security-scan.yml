---
# Scan a site's Nginx logs for attack patterns and suspicious activity.
#
# @desc     Scan a site's Nginx logs for attack patterns and suspicious activity
# @category monitoring
# @platform trellis
# @runs     local
# @mutates  false
# @requires ansible-playbook
# @arg      site         required  {example.com}  Site name as in wordpress_sites.yml
# @arg      env          required  {production|staging|development}  Target environment
# @flag     hours       optional  {24}  How many hours of log history to scan
# @flag     threshold   optional  {100}  Requests-per-IP alert threshold
# @flag     log_path    optional  {/path/to/access.log}  Override the default per-site access log path
# @example  wp-ops security-scan example.com production
# @example  wp-ops security-scan example.com production --hours 48 --threshold 50
# @doc      trellis/monitoring/README.md
- import_playbook: variable-check.yml
  vars:
    playbook: security-scan.yml

- name: Run security scan for {{ site }} {{ env }}
  hosts: web:&{{ env }}
  remote_user: "{{ web_user }}"

  vars:
    project: "{{ wordpress_sites[site] }}"
    project_root: "{{ www_root }}/{{ site }}"
    scan_hours: "{{ hours | default('24') }}"
    alert_threshold: "{{ threshold | default('100') }}"
    # Where this playbook's helper scripts live. The Go CLI stages playbooks
    # inside $TRELLIS_DIR so the project's group_vars/ resolve, which moves
    # the anchor Ansible uses for relative `src:` paths off the wp-ops tree —
    # so it passes -e wp_ops_root=. The default covers the bash CLI, which
    # runs playbooks from their own directory in place.
    monitor_scripts_dir: "{{ wp_ops_root | default(playbook_dir + '/../..', true) }}/scripts/monitoring"
    # Log file path - defaults to per-site logs, can be overridden with -e log_file=/path/to/log
    log_file: "{{ log_path | default(project_root + '/logs/access.log') }}"

  pre_tasks:
    - name: Ensure site is valid
      delegate_to: localhost
      fail:
        msg: "Site `{{ site | default('') }}` is not valid. Available sites: {{ wordpress_sites.keys() | join(', ') }}"
      when: wordpress_sites[site | default('')] is not defined

  tasks:
    - name: Check if security-monitor.sh exists on remote
      stat:
        path: "/home/{{ web_user }}/security-monitor.sh"
      register: script_stat

    - name: Copy security-monitor.sh to remote server
      copy:
        src: "{{ monitor_scripts_dir }}/security-monitor.sh"
        dest: "/home/{{ web_user }}/security-monitor.sh"
        mode: '0755'
      when: not script_stat.stat.exists

    - name: Run security scan
      shell: "/home/{{ web_user }}/security-monitor.sh {{ log_file }} {{ scan_hours }} {{ alert_threshold }}"
      register: security_report

    - name: Display security report
      debug:
        msg: "{{ security_report.stdout_lines }}"

    - name: Save report to local file
      delegate_to: localhost
      copy:
        content: "{{ security_report.stdout }}"
        dest: "{{ playbook_dir }}/security-report-{{ site }}-{{ env }}-{{ ansible_date_time.iso8601_basic_short }}.txt"
      become: no
      when: save_report is defined and save_report | bool

    - name: Check for critical alerts
      set_fact:
        has_alerts: "{{ security_report.stdout | regex_search('\\[ALERT\\]') is not none }}"

    - name: Send email alert if configured
      mail:
        host: localhost
        port: 25
        subject: "[SECURITY ALERT] {{ site }} {{ env }} - {{ ansible_date_time.date }}"
        body: "{{ security_report.stdout }}"
        to: "{{ alert_email }}"
        from: "monitoring@{{ site }}"
      when:
        - alert_email is defined
        - has_alerts
      ignore_errors: yes
