---
# Back up a site's database from any environment (development/staging/production).
#
# @desc     Back up a site's database from any environment (development/staging/production)
# @category backup
# @platform trellis
# @runs     local
# @requires ansible-playbook
# @arg      site  required  {example.com}  Site name as in wordpress_sites.yml
# @arg      env   required  {production|staging|development}  Target environment
# @example  wp-ops database-backup example.com production
# @doc      trellis/backup/README.md
- import_playbook: variable-check.yml
  vars:
    playbook: database-backup.yml

- name: Backup {{ site }} {{ env }} database
  hosts: web:&{{ env }}
  remote_user: "{{ web_user }}"

  vars:
    project: "{{ wordpress_sites[site] }}"
    project_root: "{{ www_root }}/{{ site }}"
    project_web_dir: "{{ project_root }}/current"
    project_local_path: "{{ project.local_path }}"
    local_site_dir: "{{ (playbook_dir, project_local_path) | path_join }}"
    # Where the development site's WordPress and database actually live. A
    # trellis-cli VM (`trellis vm start`, Lima) keeps both inside the VM, so the
    # host's `wp` cannot reach that database at all — but the VM mounts
    # local_path at /srv/www/{{ site }}/current, so a file written here is the
    # same file the VM reads. Development-side commands therefore run through
    # `trellis vm shell` while every path around them stays relative to that
    # shared directory. Override the detection with -e dev_target=host|vm.
    dev_target: auto
    trellis_vm_inventory: "{{ (playbook_dir, '.trellis/lima/inventory') | path_join }}"
    dev_uses_vm: "{{ dev_target == 'vm' or (dev_target == 'auto' and trellis_vm_inventory is exists) }}"
    dev_run_dir: "{{ dev_uses_vm | bool | ternary(playbook_dir, local_site_dir) }}"
    dev_vm_shell: "trellis vm shell --workdir /srv/www/{{ site }}/current -- bash -c "
    current_date_and_time: "{{ ansible_facts.date_time.date | regex_replace('\\-+', '_') }}_{{ ansible_facts.date_time.hour }}_{{ ansible_facts.date_time.minute }}_{{ ansible_facts.date_time.second }}"
    backup_file: "{{ site | regex_replace('\\.+', '_') }}_{{ env }}_{{ current_date_and_time }}.sql.gz"

  pre_tasks:
    - name: Ensure site is valid
      delegate_to: localhost
      fail:
        msg: "Site `{{ site | default('') }}` is not valid. Available sites: {{ wordpress_sites.keys() | join(', ') }}"
      when: wordpress_sites[site | default('')] is not defined

    - name: Check if {{ site }} local folder exists
      delegate_to: localhost
      stat:
        path: "{{ local_site_dir }}"
      register: result
      become: no

    - name: Abort if {{ site }} local folder doesn't exist
      fail:
        msg: "ERROR: {{ site }} is not a valid site (local folder {{ local_site_dir }} does not exist)."
      when: result.stat.exists is defined and result.stat.exists == false or result.stat.isdir is defined and result.stat.isdir == false

    - name: Check for trellis-cli ({{ site }} development runs in a Trellis VM)
      delegate_to: localhost
      shell: command -v trellis
      register: trellis_cli
      changed_when: false
      failed_when: false
      become: no
      when: dev_uses_vm | bool

    - name: Abort if trellis-cli is unavailable
      delegate_to: localhost
      fail:
        msg: >-
          ERROR: {{ site }}'s development site runs in a Trellis VM
          ({{ trellis_vm_inventory }} exists), so the development-side steps run
          through `trellis vm shell` — but trellis-cli is not on PATH. Install it,
          or re-run with -e dev_target=host if development runs on this machine.
      when: dev_uses_vm | bool and trellis_cli.rc | default(1) != 0

  tasks:
  - name: Create local database_backup directory if it doesn't exist
    delegate_to: localhost
    file:
      path: "{{ local_site_dir }}/database_backup"
      state: directory
      mode: 0755
    become: no

  - name: Export {{ env }} database
    delegate_to: localhost
    vars:
      dev_cmd: "wp db export --path=web/wp - | gzip > database_backup/{{ backup_file }}"
    shell: "{{ dev_uses_vm | bool | ternary(dev_vm_shell ~ (dev_cmd | quote), dev_cmd) }}"
    args:
      chdir: "{{ dev_run_dir }}"
    become: no
    when: env is defined and env == "development"

  - name: Export {{ env }} database
    shell: wp db export - | gzip > {{ backup_file }}
    args:
      chdir: "{{ project_web_dir }}"
    when: env is defined and env != "development"

  - name: Pull exported database from {{ env }} to local
    fetch:
      src: "{{ project_web_dir }}/{{ backup_file }}"
      dest: "{{ local_site_dir }}/database_backup/"
      flat: yes
    when: env is defined and env != "development"

  - name: Delete exported database from {{ env }}
    shell: rm -f {{ backup_file }}
    args:
      chdir: "{{ project_web_dir }}"
    when: env is defined and env != "development"
