---
# Pull a site's database from a remote environment into development, with URL search-replace.
#
# @desc     Pull a site's database from a remote environment into development, with URL search-replace
# @category backup
# @platform trellis
# @runs     local
# @requires ansible-playbook
# @arg      site  required  {example.com}  Site name as in wordpress_sites.yml
# @arg      env   required  {production|staging}  Remote environment to pull from
# @example  wp-ops database-pull example.com production
# @doc      trellis/backup/README.md
- import_playbook: variable-check.yml
  vars:
    playbook: database-pull.yml

- name: Pull {{ site }} database from {{ env }} to development
  hosts: web:&{{ env }}
  remote_user: "{{ web_user }}"

  vars_files:
    - group_vars/development/wordpress_sites.yml

  vars:
    project: "{{ wordpress_sites[site] }}"
    project_root: "{{ www_root }}/{{ site }}"
    project_web_dir: "{{ project_root }}/current"
    # `wordpress_sites` here is development's: the play loads it through
    # vars_files, which outranks the remote environment's group_vars for the
    # whole play. Both ends therefore have to be read from their own file by
    # name, or url_from and url_to come back as the same host and the
    # search-replace silently does nothing.
    remote_wordpress_sites: "{{ lookup('file', 'group_vars/' ~ env ~ '/wordpress_sites.yml') | from_yaml }}"
    url_from: "{{ remote_wordpress_sites.wordpress_sites[site].site_hosts.0.canonical }}"
    dev_wordpress_sites: "{{ lookup('file', 'group_vars/development/wordpress_sites.yml') | from_yaml }}"
    url_to: "{{ dev_wordpress_sites.wordpress_sites[site].site_hosts.0.canonical }}"
    project_local_path: "{{ dev_wordpress_sites.wordpress_sites[site].local_path }}"
    local_site_dir: "{{ (playbook_dir, project_local_path) | path_join }}"
    # Where the development site's WordPress and database actually live. A
    # trellis-cli VM (`trellis vm start`, Lima) keeps both inside the VM, so the
    # host's `wp` cannot reach that database at all — but the VM mounts
    # local_path at /srv/www/{{ site }}/current, so a file written here is the
    # same file the VM reads. Development-side commands therefore run through
    # `trellis vm shell` while every path around them stays relative to that
    # shared directory. Override the detection with -e dev_target=host|vm.
    dev_target: auto
    trellis_vm_inventory: "{{ (playbook_dir, '.trellis/lima/inventory') | path_join }}"
    dev_uses_vm: "{{ dev_target == 'vm' or (dev_target == 'auto' and trellis_vm_inventory is exists) }}"
    dev_run_dir: "{{ dev_uses_vm | bool | ternary(playbook_dir, local_site_dir) }}"
    dev_vm_shell: "trellis vm shell --workdir /srv/www/{{ site }}/current -- bash -c "
    dump_file: "{{ site | regex_replace('\\.+', '_') }}_db_dump.sql.gz"
    current_date_and_time: "{{ ansible_facts.date_time.date | regex_replace('\\-+', '_') }}_{{ ansible_facts.date_time.hour }}_{{ ansible_facts.date_time.minute }}_{{ ansible_facts.date_time.second }}"
    backup_file: "{{ site | regex_replace('\\.+', '_') }}_development_{{ current_date_and_time }}.sql.gz"

  pre_tasks:
    - name: Ensure site is valid
      delegate_to: localhost
      fail:
        msg: "Site `{{ site | default('') }}` is not valid. Available sites: {{ wordpress_sites.keys() | join(', ') }}"
      when: wordpress_sites[site | default('')] is not defined

    - name: Abort if environment variable is equal to development
      fail:
        msg: "ERROR: development is not a valid environment for this mode (you can't pull from development to development)."
      when: env == "development"

    - name: Check if {{ site }} local folder exists
      delegate_to: localhost
      stat:
        path: "{{ local_site_dir }}"
      register: result
      become: no

    - name: Abort if {{ site }} local folder doesn't exist
      fail:
        msg: "ERROR: {{ site }} is not a valid site (local folder {{ local_site_dir }} does not exist)."
      when: result.stat.exists is defined and result.stat.exists == false or result.stat.isdir is defined and result.stat.isdir == false

    - name: Check for trellis-cli ({{ site }} development runs in a Trellis VM)
      delegate_to: localhost
      shell: command -v trellis
      register: trellis_cli
      changed_when: false
      failed_when: false
      become: no
      when: dev_uses_vm | bool

    - name: Abort if trellis-cli is unavailable
      delegate_to: localhost
      fail:
        msg: >-
          ERROR: {{ site }}'s development site runs in a Trellis VM
          ({{ trellis_vm_inventory }} exists), so the development-side steps run
          through `trellis vm shell` — but trellis-cli is not on PATH. Install it,
          or re-run with -e dev_target=host if development runs on this machine.
      when: dev_uses_vm | bool and trellis_cli.rc | default(1) != 0

  tasks:
  - name: Create local database_backup directory if it doesn't exist
    delegate_to: localhost
    file:
      path: "{{ local_site_dir }}/database_backup"
      state: directory
      mode: 0755
    become: no

  - name: Create database dump on {{ env }}
    shell: wp db export --allow-root - | gzip > {{ dump_file }}
    args:
      chdir: "{{ project_web_dir }}"

  - name: Pull database dump from {{ env }} to development
    fetch:
      src: "{{ project_web_dir }}/{{ dump_file }}"
      dest: "{{ local_site_dir }}/"
      flat: yes

  - name: Delete database dump from {{ env }}
    shell: rm -f {{ dump_file }}
    args:
      chdir: "{{ project_web_dir }}"

  - name: Export development database before importing dump (backup)
    delegate_to: localhost
    vars:
      dev_cmd: "wp db export --path=web/wp - | gzip > database_backup/{{ backup_file }}"
    shell: "{{ dev_uses_vm | bool | ternary(dev_vm_shell ~ (dev_cmd | quote), dev_cmd) }}"
    args:
      chdir: "{{ dev_run_dir }}"
    become: no

  - name: Import database dump on development
    delegate_to: localhost
    vars:
      dev_cmd: "gzip -c -d {{ dump_file }} | wp db import --path=web/wp -"
    shell: "{{ dev_uses_vm | bool | ternary(dev_vm_shell ~ (dev_cmd | quote), dev_cmd) }}"
    args:
      chdir: "{{ dev_run_dir }}"
    become: no

  - name: Delete database dump from development
    delegate_to: localhost
    file:
      path: "{{ local_site_dir }}/{{ dump_file }}"
      state: absent
    become: no

  - name: Search for {{ url_from }} and replace with {{ url_to }} on development
    delegate_to: localhost
    vars:
      dev_cmd: "wp search-replace '//{{ url_from }}' '//{{ url_to }}' --allow-root --all-tables --precise --path=web/wp"
    shell: "{{ dev_uses_vm | bool | ternary(dev_vm_shell ~ (dev_cmd | quote), dev_cmd) }}"
    args:
      chdir: "{{ dev_run_dir }}"
    become: no
    tags: ['search-replace']
