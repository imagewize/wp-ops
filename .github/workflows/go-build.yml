name: Go Build

on:
  push:
    branches: [main]
    paths:
      - 'go/**'
      - '.github/workflows/go-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'go/**'
      - '.github/workflows/go-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod

      - name: Generate catalog
        run: go generate ./...

      - name: Check catalog.json is up to date
        run: git diff --exit-code -- internal/catalog/catalog.json

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
