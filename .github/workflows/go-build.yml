name: Go Build

# The catalog is generated from the manifests in the command categories, not
# just from go/ — so the drift check ("Check catalog.json is up to date")
# below has to run when a *manifest* changes too, or a manifest-only PR
# merges with a stale catalog.json and fails some later, unrelated go/ PR
# instead. The category list mirrors catalog.Categories in
# go/internal/catalog/catalog.go — keep the two in sync.
on:
  push:
    branches: [main]
    # Duplicated below rather than shared via a YAML anchor — GitHub Actions
    # does not support anchors in workflow files.
    paths:
      - 'go/**'
      - '.github/workflows/go-build.yml'
      - 'scripts/**'
      - 'trellis/**'
      - 'wp-cli/**'
      - 'mcp-server/**'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths:
      - 'go/**'
      - '.github/workflows/go-build.yml'
      - 'scripts/**'
      - 'trellis/**'
      - 'wp-cli/**'
      - 'mcp-server/**'
      - 'docs/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # Both paths are repo-root-relative: an action resolves its own
          # inputs itself, so defaults.run.working-directory (go) applies
          # only to `run:` steps, not here. go.mod/go.sum live at the repo
          # root (the module covers the whole repo so the root-level
          # `assets` package's go:embed directives can reach scripts/,
          # trellis/, etc. — see docs/dev/m4-go-cli-completion.md task 6).
          # Without cache-dependency-path setup-go looks for ./go.sum,
          # doesn't find it, and silently disables dependency caching.
          cache-dependency-path: go.sum

      - name: Generate catalog
        run: go generate ./...

      - name: Check catalog.json is up to date
        run: git diff --exit-code -- internal/catalog/catalog.json

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build, vet and test root assets package
        # The go/ subtree's ./... patterns above don't reach the root-level
        # `assets` package (its go:embed directives are what let the
        # binary embed scripts/, trellis/, etc. — see
        # docs/dev/m4-go-cli-completion.md task 6). go/'s Build step above
        # already compiles it transitively as an import, but vet doesn't
        # visit dependencies, so it gets its own explicit check here.
        #
        # `go test .` and not `./...`: go.mod lives at the repo root, so a
        # root-level ./... would re-run every go/ test the Test step just ran.
        # The dot keeps this to assets_test.go, which is what guards the
        # mcp-server/ embed list against re-acquiring node_modules/, dist/ and
        # the operator's config/sites.json.
        working-directory: .
        run: |
          go build ./...
          go test .
          go vet ./...

  bash32-syntax:
    # wp-ops runs shipped scripts with /bin/bash, which on macOS is bash 3.2.
    # The build job's TestShellScriptsParseWithSystemBash runs on Ubuntu, where
    # /bin/bash is bash 5 and accepts syntax 3.2 rejects. 5.45.1 shipped a
    # db-pull.sh with `case ... ;;` inside a heredoc inside $( ) that parsed
    # on bash 5 and failed for every macOS user. This job checks every tracked
    # .sh with the real 3.2 parser. Syntax only: a bash-4 feature that parses
    # on 3.2 but fails at runtime (${var,,}, mapfile) still gets through.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Shell scripts parse under macOS /bin/bash (3.2)
        run: |
          /bin/bash --version | head -1
          fail=0
          count=0
          while IFS= read -r f; do
            count=$((count + 1))
            /bin/bash -n "$f" || { echo "::error file=$f::does not parse under /bin/bash 3.2"; fail=1; }
          done < <(git ls-files '*.sh')
          echo "Checked $count scripts"
          exit $fail
